<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员手机号 <span class="text-danger">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-mobile" data-rule="required" class="form-control" name="row[mobile]" type="text" value="" maxlength="20" placeholder="填写已注册会员的手机号">
            <span class="help-block">须为前台已注册会员；该手机号对应的会员若已被绑定则需先解除原绑定</span>
        </div>
    </div>
    {if $isSuperAdmin}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">绑定到管理员 <span class="text-danger">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-admin_id" data-rule="required" class="form-control selectpicker" name="row[admin_id]">
                <option value="">请选择子后台管理员</option>
                {foreach name="adminList" item="vo" key="k"}
                <option value="{$k|htmlentities}">{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    {/if}
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
