<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id|htmlentities}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">
                {$userInfo.username|default=''} / {$userInfo.mobile|default=''} / {$userInfo.nickname|default=''}
            </p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">改绑到管理员 <span class="text-danger">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-admin_id" data-rule="required" class="form-control selectpicker" name="row[admin_id]">
                {foreach name="adminList" item="vo" key="k"}
                <option value="{$k|htmlentities}" {if $k == $row.admin_id}selected{/if}>{$vo|htmlentities}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
