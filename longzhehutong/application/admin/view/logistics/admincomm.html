<!-- 微信风格聊天记录区域 -->
<div class="wechat-chat-container" style="height: 400px; background: linear-gradient(to bottom, #f0f0f0 0%, #e8e8e8 100%); border: 1px solid #d9d9d9; border-radius: 8px; margin-bottom: 20px; overflow: hidden; position: relative;">
    <!-- 聊天头部 -->
    <div class="chat-header" style="background: #2c2c2c; color: white; padding: 12px 15px; border-bottom: 1px solid #3a3a3a;">
        <div style="display: flex; align-items: center;">
            <div style="width: 8px; height: 8px; background: #4caf50; border-radius: 50%; margin-right: 8px;"></div>
            <span style="font-size: 14px; font-weight: 500;">问题反馈</span>
        </div>
    </div>
    
    <!-- 聊天消息区域 -->
    <div class="chat-messages" id="chatMessages" style="height: calc(100% - 50px); overflow-y: auto; padding: 15px 10px; background: #ededed;">
        <!-- 循环展示所有消息 -->
        {volist name="row" id="vo"}
        <div class="message-wrapper" style="margin-bottom: 20px; display: flex; justify-content: flex-start;">
            <div class="message-avatar" style="width: 40px; height: 40px; background: #4caf50; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 10px; flex-shrink: 0;">
                <i class="fa fa-robot" style="color: white; font-size: 18px;"></i>
            </div>
            <div class="message-content-wrapper" style="max-width: 70%;">
                <div class="message-bubble" style="background: white; border-radius: 18px; padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative;">
                    <div class="message-text" style="font-size: 14px; line-height: 1.4; color: #333;">
                        <div style="margin-bottom: 6px;"><strong>{$vo.group_name}{$vo.mobile}：</strong>{$vo.content}</div>
                    </div>
                </div>
                <div class="message-time" style="font-size: 11px; color: #999; margin-top: 5px; margin-left: 5px;">
                    {$vo.createtime|date='Y-m-d H:i',###}
                </div>
            </div>
        </div>
        {/volist}
    </div>
</div>

<!-- 微信风格输入区域 -->
<form id="logisticsForm" role="form" autocomplete="off" method="post">
    <div class="wechat-input-container" style="background: #f7f7f7; border-top: 1px solid #d9d9d9; padding: 10px 15px; border-radius: 0 0 8px 8px;">
        <div class="input-group" style="margin-bottom: 0;">
            <input id="messageInput" name="message" type="text" class="form-control" 
                   placeholder="请输入消息内容..."
                   style="border-radius: 20px; border: 1px solid #d9d9d9; padding: 8px 16px; font-size: 14px; background: white; box-shadow: none;" />
            <span class="input-group-btn">
                <button id="submitBtn" type="button" class="btn" 
                        style="border-radius: 20px; padding: 8px 16px; margin-left: 8px; background: #95ec69; border: none; color: #000; font-weight: 500;" disabled>
                    <i class="fa fa-paper-plane"></i>
                </button>
            </span>
        </div>
    </div>
    
    <!-- 隐藏字段用于存储解析后的数据 -->
    <input type="hidden" id="content" name="content" value="" />

<!--    <div class="layer-footer footer-bar">-->
<!--        <div class="row">-->
<!--            <label class="control-label col-xs-12 col-sm-4"></label>-->
<!--            <div class="col-xs-12 col-sm-8">-->
<!--                <button id="submitBtn" type="button" class="btn btn-primary btn-embossed" disabled>提交</button>-->
<!--            </div>-->
<!--        </div>-->
<!--    </div>-->
</form>

<style>
/* 微信风格样式优化 */
.wechat-chat-container {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

.chat-messages {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.chat-messages::-webkit-scrollbar {
    width: 6px;
}

.chat-messages::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 3px;
}

.chat-messages::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 3px;
}

.chat-messages::-webkit-scrollbar-thumb:hover {
    background: #a8a8a8;
}

.message-wrapper {
    display: flex;
    align-items: flex-start;
    margin-bottom: 15px;
    animation: fadeInUp 0.3s ease-out;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message-bubble {
    position: relative;
    word-wrap: break-word;
    word-break: break-all;
    max-width: 100%;
}

.message-bubble::before {
    content: '';
    position: absolute;
    top: 10px;
    width: 0;
    height: 0;
    border: 6px solid transparent;
}

.message-wrapper:not(.user-message) .message-bubble::before {
    left: -12px;
    border-right-color: white;
}

.message-wrapper.user-message .message-bubble::before {
    right: -12px;
    border-left-color: #95ec69;
}

.message-avatar {
    flex-shrink: 0;
    margin-right: 10px;
}

.message-content-wrapper {
    flex: 1;
    max-width: 70%;
}

#messageInput:focus {
    border-color: #95ec69 !important;
    box-shadow: 0 0 0 2px rgba(149, 236, 105, 0.2) !important;
    outline: none;
}

#submitBtn:not(:disabled):hover {
    background: #7ed321 !important;
    transform: scale(1.05);
    transition: all 0.2s ease;
}

#submitBtn:disabled {
    background: #d9d9d9 !important;
    color: #999 !important;
    cursor: not-allowed;
}
</style>

<script>
    (function () {
        var messageInput = document.getElementById('messageInput');
        var submitBtn = document.getElementById('submitBtn');
        var chatMessages = document.getElementById('chatMessages');
        
        // 隐藏字段
        var content = document.getElementById('content');
        
        // 显示区域的元素
        var displayPickupDriverName = document.getElementById('displayPickupDriverName');

        function getIdsFromUrl() {
            var url = new URL(window.location.href);
            var fromQuery = url.searchParams.get('ids');
            if (fromQuery) return fromQuery;
            var m = url.pathname.match(/\/ids\/([^\/?]+)/);
            return m ? m[1] : '';
        }

        // 解析输入的消息 - 自由输入，不做格式限制
        function parseMessage(message) {
            return {
                content: message.trim()
            };
        }

        // 验证解析后的数据 - 只要有内容就可以发送
        function validateData(data) {
            return data && data.content && data.content.length > 0;
        }

        // 更新按钮状态
        function updateButtonState() {
            var message = messageInput.value.trim();
            var data = parseMessage(message);
            submitBtn.disabled = !validateData(data);
        }

        // 添加消息到聊天区域 - 微信风格
        function addMessageToChat(content, isUser) {
            var messageWrapper = document.createElement('div');
            messageWrapper.className = 'message-wrapper' + (isUser ? ' user-message' : '');
            messageWrapper.style.cssText = 'display: flex; align-items: flex-start; ' + 
                (isUser ? 'justify-content: flex-end;' : 'justify-content: flex-start;');
            
            // 头像
            var avatarDiv = document.createElement('div');
            avatarDiv.className = 'message-avatar';
            avatarDiv.style.cssText = 'width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; ' +
                (isUser ? 'margin-left: 10px; background: #95ec69;' : 'margin-right: 10px; background: #4caf50;') + 
                ' flex-shrink: 0;';
            avatarDiv.innerHTML = '<i class="fa fa-' + (isUser ? 'user' : 'robot') + '" style="color: white; font-size: 18px;"></i>';
            
            // 消息内容包装器
            var contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            contentWrapper.style.cssText = 'flex: 1; max-width: 70%;';
            
            // 消息气泡
            var bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.style.cssText = 'border-radius: 18px; padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; word-break: break-all; max-width: 100%; ' +
                (isUser ? 'background: #95ec69; margin-left: 10px;' : 'background: white;');
            
            // 消息文本
            var textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.style.cssText = 'font-size: 14px; line-height: 1.4; color: ' + (isUser ? '#000' : '#333') + ';';
            textDiv.innerHTML = content;
            
            // 时间
            var timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.style.cssText = 'font-size: 11px; color: #999; margin-top: 5px; ' + 
                (isUser ? 'text-align: right; margin-right: 10px;' : 'margin-left: 5px;');
            timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
            
            // 组装消息
            bubbleDiv.appendChild(textDiv);
            contentWrapper.appendChild(bubbleDiv);
            contentWrapper.appendChild(timeDiv);
            
            if (isUser) {
                messageWrapper.appendChild(contentWrapper);
                messageWrapper.appendChild(avatarDiv);
            } else {
                messageWrapper.appendChild(avatarDiv);
                messageWrapper.appendChild(contentWrapper);
            }
            
            chatMessages.appendChild(messageWrapper);
            
            // 滚动到底部
            setTimeout(function() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 100);
        }

        // 更新显示区域
        function updateDisplayArea() {
            if (displayPickupDriverName) {
                displayPickupDriverName.textContent = content.value || '未填写';
            }
        }

        // 输入事件监听
        messageInput.addEventListener('input', updateButtonState);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !submitBtn.disabled) {
                submitBtn.click();
            }
        });

        // 提交按钮事件
        submitBtn.addEventListener('click', function () {
            var message = messageInput.value.trim();
            var data = parseMessage(message);
            
            if (!validateData(data)) {
                alert('请输入内容');
                return;
            }

            // 添加用户消息到聊天区域
            addMessageToChat(
                '<div style="margin-bottom: 6px;">' + data.content + '</div>',
                true
            );

            // 更新隐藏字段
            content.value = data.content;

            // 更新显示区域
            updateDisplayArea();

            var ids = getIdsFromUrl();
            var payload = new URLSearchParams();
            payload.append('content', data.content);
            payload.append('ids', ids);
            payload.append('redirect_url', window.location.href);

            submitBtn.disabled = true;
            messageInput.disabled = true;


            var url = "{:url('logistics/add_admincomm')}";
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                },
                credentials: 'same-origin',
                body: payload.toString()
            })
                .then(function (res) {
                    var contentType = res.headers.get('content-type') || '';
                    if (contentType.indexOf('application/json') !== -1) {
                        return res.json();
                    }
                    return res.text().then(function (text) {
                        return { code: 0, msg: text };
                    });
                })
                .then(function (resp) {
                    var ok = !!(resp && (Number(resp.code) === 1 || resp.success || (typeof resp.status === 'string' && resp.status.toLowerCase() === 'success')));
                    if (ok) {
                        // 添加成功消息
                        addMessageToChat('<div style="color: #4caf50;"><i class="fa fa-check-circle"></i> 信息已成功保存！</div>', false);
                        
                        // 清空输入框
                        messageInput.value = '';
                        updateButtonState();
                        
                        setTimeout(function() {
                            try {
                                if (window.parent && window.parent.layer) {
                                    var frameIndex = window.parent.layer.getFrameIndex(window.name);
                                    window.parent.layer.close(frameIndex);
                                    window.parent.location.reload();
                                    return;
                                }
                            } catch (e) {
                                // 忽略
                            }
                            window.location.reload();
                        }, 1500);
                    } else {
                        addMessageToChat('<div style="color: #f44336;"><i class="fa fa-exclamation-circle"></i> 保存失败：' + ((resp && resp.msg) || '未知错误') + '</div>', false);
                    }
                })
                .catch(function (e) {
                    console.error(e);
                    addMessageToChat('<div style="color: #f44336;"><i class="fa fa-exclamation-circle"></i> 网络错误，请重试</div>', false);
                })
                .finally(function () {
                    submitBtn.disabled = false;
                    messageInput.disabled = false;
                    messageInput.focus();
                });
        });

        // 初始化
        updateDisplayArea();
        updateButtonState();
        messageInput.focus();
        
        // 页面加载完成后滚动到底部
        setTimeout(function() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 200);
    })();
</script>
