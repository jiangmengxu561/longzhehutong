<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shipping_province')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shipping_province" class="form-control" name="row[shipping_province]" type="text" value="{$row.shipping_province|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Origincity')}:</label>
        <div class="col-xs-12 col-sm-8">
<!--            <div class='control-relative'><input id="c-origincity" class="form-control" data-toggle="city-picker" name="row[origincity]" type="text" value="{$row.origincity|htmlentities}"></div>-->
            <input id="c-origincity" class="form-control" name="row[origincity]" type="text" value="{$row.origincity|htmlentities}">

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Province')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-province" class="form-control" name="row[province]" type="text" value="{$row.province|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Destination')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-destination" class="form-control" name="row[destination]" type="text" value="{$row.destination|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shipping_area')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shipping_area" class="form-control" name="row[shipping_area]" type="text" value="{$row.shipping_area|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shipping_logistics_park')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shipping_logistics_park" class="form-control" name="row[shipping_logistics_park]" type="text" value="{$row.shipping_logistics_park|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shipping_logistics_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shipping_logistics_name" class="form-control" name="row[shipping_logistics_name]" type="text" value="{$row.shipping_logistics_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shipping_logistics_address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shipping_logistics_address" class="form-control" name="row[shipping_logistics_address]" type="text" value="{$row.shipping_logistics_address|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shipping_logistics_mobile')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shipping_logistics_mobile" class="form-control" name="row[shipping_logistics_mobile]" type="text" value="{$row.shipping_logistics_mobile|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Arrival_area')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-arrival_area" class="form-control" name="row[arrival_area]" type="text" value="{$row.arrival_area|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Arrival_logistics_park')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-arrival_logistics_park" class="form-control" name="row[arrival_logistics_park]" type="text" value="{$row.arrival_logistics_park|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Arrival_logistics_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-arrival_logistics_name" class="form-control" name="row[arrival_logistics_name]" type="text" value="{$row.arrival_logistics_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Arrival_logistics_address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-arrival_logistics_address" class="form-control" name="row[arrival_logistics_address]" type="text" value="{$row.arrival_logistics_address|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Arrival_logistics_mobile')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-arrival_logistics_mobile" class="form-control" name="row[arrival_logistics_mobile]" type="text" value="{$row.arrival_logistics_mobile|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Time_limit')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-time_limit" class="form-control" name="row[time_limit]" type="number" value="{$row.time_limit|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Distance')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-distance" class="form-control" name="row[distance]" type="number" value="{$row.distance|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Side')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-side" class="form-control" name="row[side]" type="text" value="{$row.side|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Perton')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-perton" class="form-control" name="row[perton]" type="text" value="{$row.perton|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('重泡')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-reflux" class="form-control" name="row[reflux]" type="text" value="{$row.reflux|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('轻泡')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-bulky" class="form-control" name="row[bulky]" type="text" value="{$row.reflux|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">

            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Logistics_status')}:</label>
        <div class="col-xs-12 col-sm-8">

            <div class="radio">
                {foreach name="logisticsStatusList" item="vo"}
                <label for="row[logistics_status]-{$key}"><input id="row[logistics_status]-{$key}" name="row[logistics_status]" type="radio" value="{$key}" {in name="key" value="$row.logistics_status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">物流评级:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label><input name="row[level]" type="radio" value="0" {eq name="row.level" value="0"}checked{/eq} /> 未评级</label>
                {foreach name="levelList" item="vo"}
                <label for="row[level]-{$key}"><input id="row[level]-{$key}" name="row[level]" type="radio" value="{$key}" {eq name="row.level" value="$key"}checked{/eq} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Remarks')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remarks" class="form-control" name="row[remarks]" type="text" value="{$row.remarks|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Maintained')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-maintained" class="form-control selectpicker" name="row[maintained]">
                <option value="0" {eq name="row.maintained" value="0"}selected{/eq}>{:__('Maintained 0')}</option>
                <option value="1" {eq name="row.maintained" value="1"}selected{/eq}>{:__('Maintained 1')}</option>
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
