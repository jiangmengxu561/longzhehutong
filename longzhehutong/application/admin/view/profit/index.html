<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-bar-chart"></i> 公司利润报表</h3>
    </div>
    <div class="panel-body">

        <!-- 查询条件 -->
        <div class="row">
            <div class="col-md-12">
                <div class="form-inline" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label>开始日期：</label>
                        <input type="text" class="form-control datetimepicker" id="startdate" data-date-format="YYYY-MM-DD" placeholder="开始日期" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 10px;">
                        <label>结束日期：</label>
                        <input type="text" class="form-control datetimepicker" id="enddate" data-date-format="YYYY-MM-DD" placeholder="结束日期" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 10px;">
                        <button type="button" class="btn btn-primary" id="search-btn">
                            <i class="fa fa-search"></i> 查询
                        </button>
                        <button type="button" class="btn btn-success" id="export-btn">
                            <i class="fa fa-download"></i> 导出
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计概览 -->
        <div class="row" id="statistics-cards">
            <div class="col-md-3">
                <div class="info-box bg-green">
                    <span class="info-box-icon"><i class="fa fa-arrow-up"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">主营收入</span>
                        <span class="info-box-number" id="total-income">￥0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="info-box bg-red">
                    <span class="info-box-icon"><i class="fa fa-arrow-down"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">总成本</span>
                        <span class="info-box-number" id="total-expense">￥0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="info-box bg-blue">
                    <span class="info-box-icon"><i class="fa fa-line-chart"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">公司利润</span>
                        <span class="info-box-number" id="net-profit">￥0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="info-box bg-yellow">
                    <span class="info-box-icon"><i class="fa fa-percent"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">利润率</span>
                        <span class="info-box-number" id="profit-rate">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="row" style="margin-top: 20px;">
            <div class="col-md-12">
                <div class="box">
                    <div class="box-header with-border">
                        <h3 class="box-title">利润趋势图</h3>
                    </div>
                    <div class="box-body">
                        <canvas id="profitChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详细数据表格 -->
        <div class="row" style="margin-top: 20px;">
            <div class="col-md-12">
                <div class="box">
                    <div class="box-header with-border">
                        <h3 class="box-title">详细数据</h3>
                    </div>
                    <div class="box-body">
                        <table id="report-table" class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>主营收入</th>
                                    <th>总成本</th>
                                    <th>公司利润</th>
                                    <th>订单量</th>
                                </tr>
                            </thead>
                            <tbody id="report-tbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
