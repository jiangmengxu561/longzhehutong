<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="row">
            <div class="col-md-12">
                <div class="form-inline ledger-filter-bar" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label>开始日期：</label>
                        <input type="text" class="form-control datetimepicker" id="startdate" data-date-format="YYYY-MM-DD" placeholder="开始日期" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <label>结束日期：</label>
                        <input type="text" class="form-control datetimepicker" id="enddate" data-date-format="YYYY-MM-DD" placeholder="结束日期" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <button type="button" class="btn btn-primary" id="search-btn"><i class="fa fa-search"></i> 查询</button>
                        <button type="button" class="btn btn-default" id="back-btn"><i class="fa fa-arrow-left"></i> 返回总览</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="ledger-statistics" style="margin-bottom: 15px;"></div>

        <div class="row" style="margin-bottom: 15px;">
            <div class="col-md-12">
                <div class="box">
                    <div class="box-header with-border">
                        <h3 class="box-title">调度费用柱状图</h3>
                    </div>
                    <div class="box-body">
                        <canvas id="ledgerChart" height="110"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
            </div>
        </div>
    </div>
</div>

<style>
.ledger-filter-bar .form-group { margin-bottom: 8px; }
.ledger-row-paid > td { background: rgba(92,184,92,0.07) !important; }
.ledger-row-unpaid > td { background: rgba(217,83,79,0.07) !important; }
.ledger-row-partial > td { background: rgba(240,173,78,0.08) !important; }
.ledger-row-empty > td { background: rgba(153,153,153,0.05) !important; }
.badge-state { display:inline-block; padding:3px 8px; border-radius:12px; font-size:12px; }
.badge-state.paid { background:#dff0d8; color:#3c763d; }
.badge-state.unpaid { background:#f2dede; color:#a94442; }
.badge-state.partial { background:#fcf8e3; color:#8a6d3b; }
.badge-state.empty { background:#eee; color:#777; }
</style>
