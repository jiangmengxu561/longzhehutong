<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="row">
            <div class="col-md-12">
                <div class="form-inline ledger-filter-bar" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label>开始日期：</label>
                        <input type="text" class="form-control datetimepicker" id="startdate" data-date-format="YYYY-MM-DD" placeholder="开始日期" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <label>结束日期：</label>
                        <input type="text" class="form-control datetimepicker" id="enddate" data-date-format="YYYY-MM-DD" placeholder="结束日期" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <label>订单号：</label>
                        <input type="text" class="form-control" id="orderid" placeholder="订单号" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <label>下单人：</label>
                        <input type="text" class="form-control" id="username" placeholder="下单人" style="width: 150px;">
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <label>付款状态：</label>
                        <select class="form-control" id="payment_state" style="width: 120px;">
                            <option value="all">全部</option>
                            <option value="paid">已付款</option>
                            <option value="partial">部分付款</option>
                            <option value="unpaid">未付款</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <label>调度：</label>
                        <select class="form-control" id="dispatch_id" style="width: 150px;">
                            <option value="0">全部</option>
                            {volist name="dispatchList" id="dispatch"}
                            <option value="{$dispatch.admin_id}">{$dispatch.name}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group" style="margin-left: 8px;">
                        <button type="button" class="btn btn-primary" id="search-btn"><i class="fa fa-search"></i> 查询</button>
                        <button type="button" class="btn btn-success" id="dispatch-btn"><i class="fa fa-sitemap"></i> 调度汇总</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="ledger-statistics" style="margin-bottom: 15px;"></div>

        <div class="row" style="margin-bottom: 15px;">
            <div class="col-md-12">
                <div class="box">
                    <div class="box-header with-border">
                        <h3 class="box-title">每日费用柱状图</h3>
                    </div>
                    <div class="box-body">
                        <canvas id="ledgerChart" height="110"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="widget-body no-padding">
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
.ledger-filter-bar .form-group { margin-bottom: 8px; }
.ledger-stat-card {
    background: #fff;
    border-radius: 6px;
    border: 1px solid #e7e7e7;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.ledger-stat-card .title { color: #666; font-size: 13px; margin-bottom: 6px; }
.ledger-stat-card .value { font-size: 20px; font-weight: 700; }
.ledger-paid { background: #eaf8ef !important; color: #1e7e34 !important; }
.ledger-unpaid { background: #fdecec !important; color: #c9302c !important; }
.ledger-partial { background: #fff4df !important; color: #c77d00 !important; }
.ledger-outrange { background: #f0f0f0 !important; color: #000 !important; }
.ledger-shipment-black { background: #fff4df !important; color: #c77d00 !important; }
.ledger-row-paid > td { background: rgba(92,184,92,0.07) !important; }
.ledger-row-unpaid > td { background: rgba(217,83,79,0.07) !important; }
.ledger-row-partial > td { background: rgba(240,173,78,0.08) !important; }
.ledger-row-empty > td { background: rgba(153,153,153,0.05) !important; }
.badge-state { display:inline-block; padding:3px 8px; border-radius:12px; font-size:12px; }
.badge-state.paid { background:#dff0d8; color:#3c763d; }
.badge-state.unpaid { background:#f2dede; color:#a94442; }
.badge-state.partial { background:#fcf8e3; color:#8a6d3b; }
.badge-state.empty { background:#eee; color:#777; }
</style>
