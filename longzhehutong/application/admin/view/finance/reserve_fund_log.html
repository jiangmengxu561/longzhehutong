<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="row" style="margin-bottom: 15px;">
            <div class="col-md-12">
                <div class="form-inline">
                    <div class="form-group">
                        <button type="button" class="btn btn-default" id="back-btn"><i class="fa fa-arrow-left"></i> 返回备用金列表</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" style="margin-bottom: 15px;">
            <div class="col-md-12">
                <div class="form-inline">
                    <div class="form-group">
                        <label for="startdate">日期</label>
                        <input type="date" id="startdate" class="form-control" style="margin-left: 5px;">
                    </div>
                    <span style="margin: 0 6px;">至</span>
                    <div class="form-group">
                        <input type="date" id="enddate" class="form-control">
                    </div>
                    <div class="form-group" style="margin-left: 10px;">
                        <label for="dispatch_id">调度</label>
                        <select id="dispatch_id" class="form-control" style="margin-left: 5px; min-width: 150px;">
                            <option value="0">全部调度</option>
                            {volist name="dispatchAdmins" id="dispatch"}
                            <option value="{$dispatch.admin_id}">{$dispatch.name|htmlentities}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group" style="margin-left: 10px;">
                        <label for="order_number">订单号</label>
                        <input type="text" id="order_number" class="form-control" placeholder="请输入订单号" style="margin-left: 5px;">
                    </div>
                    <button type="button" class="btn btn-primary" id="search-btn" style="margin-left: 10px;"><i class="fa fa-search"></i> 搜索</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
            </div>
        </div>
    </div>
</div>
