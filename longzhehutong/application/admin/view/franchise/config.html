<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <form id="config-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
            {:token()}
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">改会员月费(元/月):</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-member_month_fee" class="form-control" name="member_month_fee" type="number" step="0.01" min="0.01" value="{$cfg.member_month_fee}">
                    <span class="help-block">全加盟商共用，总部统一设置</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">新增二级扣费(元):</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-add_level2_fee" class="form-control" name="add_level2_fee" type="number" step="0.01" min="0.01" value="{$cfg.add_level2_fee}">
                    <span class="help-block">全加盟商共用，总部统一设置</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">加盟商月费(元/月):</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-monthly_fee" class="form-control" name="monthly_fee" type="number" step="0.01" min="0" value="{$cfg.monthly_fee}">
                    <span class="help-block">每个正常加盟商每月自动从钱包扣取（设为0则不扣）</span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">规则模板加盟商:</label>
                <div class="col-xs-12 col-sm-8">
                    <select id="c-template_franchise_id" class="form-control selectpicker" name="template_franchise_id">
                        <option value="0">自动（取最小 id 的一级加盟商）</option>
                        {foreach $level1List as $l}
                        <option value="{$l.id}" {if $l.id==$cfg.template_franchise_id}selected{/if}>{$l.name}</option>
                        {/foreach}
                    </select>
                    <span class="help-block">新建加盟商及其线路/调度/财务，将按该加盟商的菜单/权限自动生成</span>
                </div>
            </div>
            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
