<form id="staffadd-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="franchise_id" value="{$franchiseId}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">角色:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-role" class="form-control selectpicker" name="role">
                <option value="lin">线路</option>
                <option value="diao">调度</option>
                <option value="cai">财务</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">登录账号:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-username" class="form-control" name="username" type="text" placeholder="必填，用于登录后台">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">登录密码:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-password" class="form-control" name="password" type="password" placeholder="必填，6-30位">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">姓名/昵称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-nickname" class="form-control" name="nickname" type="text" placeholder="选填">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">电话/手机号:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-mobile" class="form-control" name="mobile" type="text" placeholder="线路/调度必填" data-rule="mobile" required>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
<script>
(function () {
    var roleSel = document.getElementById('c-role');
    var mobileInput = document.getElementById('c-mobile');
    function toggleMobileRequired() {
        var required = roleSel && roleSel.value !== 'cai';
        if (required) {
            mobileInput.setAttribute('required', 'required');
            mobileInput.setAttribute('data-rule', 'mobile');
            mobileInput.placeholder = '线路/调度必填';
        } else {
            mobileInput.removeAttribute('required');
            mobileInput.removeAttribute('data-rule');
            mobileInput.placeholder = '财务选填';
        }
    }
    roleSel.addEventListener('change', toggleMobileRequired);
    toggleMobileRequired();
})();
</script>
