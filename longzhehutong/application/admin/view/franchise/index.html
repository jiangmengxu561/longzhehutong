<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="alert alert-info" style="margin-bottom: 15px;">
                    <i class="fa fa-coins"></i> 累计抽佣总额：<strong style="font-size: 18px;color: #c9302c;">¥{$commissionTotal}</strong>
                    <span class="text-muted" style="margin-left: 8px;">（订单完成时按比例扣除的抽佣合计）</span>
                </div>
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('franchise/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('franchise/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> {:__('Delete')}</a>
                        <a href="javascript:;" class="btn btn-info btn-fr-config {:$auth->check('franchise/config')?'':'hide'}" title="加盟商全局设置"><i class="fa fa-cogs"></i> 全局设置</a>
                        <a href="javascript:;" class="btn btn-primary btn-comm-detail" title="抽佣明细"><i class="fa fa-list-alt"></i> 抽佣明细</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('franchise/edit')}"
                           data-operate-del="{:$auth->check('franchise/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
