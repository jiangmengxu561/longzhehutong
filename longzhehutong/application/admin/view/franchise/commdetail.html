<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i> </a>
                <form class="form-inline" style="display: inline-block; margin-left: 10px; margin-bottom: 0;">
                    <div class="form-group">
                        <label>开始：</label>
                        <input type="text" class="form-control datetimepicker" id="startdate" data-date-format="YYYY-MM-DD" placeholder="开始日期" style="width: 120px;">
                    </div>
                    <div class="form-group" style="margin-left: 6px;">
                        <label>结束：</label>
                        <input type="text" class="form-control datetimepicker" id="enddate" data-date-format="YYYY-MM-DD" placeholder="结束日期" style="width: 120px;">
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-comm-search"><i class="fa fa-search"></i> 查询</button>
                </form>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
        </div>
    </div>
</div>
