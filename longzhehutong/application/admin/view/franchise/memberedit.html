<form id="memberedit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="user_id" value="{$row.id}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.username}（{$row.mobile}）" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">用户名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-username" class="form-control" name="username" type="text" value="{$row.username|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">身份/职位:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-membertype" class="form-control selectpicker" name="membertype">
                {foreach $membertypeList as $k => $v}
                <option value="{$k}" {if $row.membertype==$k}selected{/if}>{$v}</option>
                {/foreach}
            </select>
            {if $row.formal_employee_quota > 0}
            <span class="help-block">正式员工名额：已用 {$row.formal_employee_count} / 上限 {$row.formal_employee_quota}（设为正式员工免费，占一名额）</span>
            {else}
            <span class="help-block">设为“正式员工”免费；设为“兼职/普通/会展”或改到期时间将按月扣费</span>
            {/if}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">到期时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-member_time" class="form-control form-control-date" name="member_time" type="text"
                   placeholder="选择到期日期，不足1个月按1个月计费" value="{$row.member_time_text}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">平台抽佣%:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-platform_commission" class="form-control" name="platform_commission" type="number" step="0.01" min="0" value="{$row.platform_commission}" placeholder="平台抽佣百分比">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
