<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
<!--                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('admin/order/add')?'':'hide'}" title="{:__('Add')}" ><i class="fa fa-plus"></i> {:__('Add')}</a>-->
<!--                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('admin/order/edit')?'':'hide'}" title="{:__('Edit')}" ><i class="fa fa-pencil"></i> {:__('Edit')}</a>-->
<!--                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('admin/order/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>-->
                        

                        

                        
                    </div>
                    <div id="order-statistics" class="order-statistics-panel" style="display: none;"></div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('admin/order/edit')}"
                           data-operate-del="{:$auth->check('admin/order/del')}"
                           data-is-sales="{$isSales|default=0}"
                           data-group-identity="{$groupIdentity|default=0}"
                           width="100%">
                    </table>
                </div>
            </div>
 
        </div>
    </div>
</div>
<style>
.order-statistics-panel {
    margin: 15px 0;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 4px;
    border: 1px solid #ddd;
}
.order-statistics-panel .statistics-item {
    text-align: center;
    padding: 15px;
    background: #fff;
    border-radius: 4px;
    border: 1px solid #e0e0e0;
    margin-bottom: 10px;
}
.order-statistics-panel .statistics-item.income {
    border-left: 4px solid #5cb85c;
}
.order-statistics-panel .statistics-item.expense {
    border-left: 4px solid #f0ad4e;
}
.order-statistics-panel .statistics-item.profit {
    border-left: 4px solid #337ab7;
}
.order-statistics-panel .statistics-label {
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
    font-weight: 500;
}
.order-statistics-panel .statistics-value {
    font-size: 24px;
    font-weight: bold;
    color: #333;
}
.order-statistics-panel .statistics-value.text-success {
    color: #5cb85c;
}
.order-statistics-panel .statistics-value.text-danger {
    color: #d9534f;
}
/* 订单列表横向滚动时固定前两列（ID / 订单号），避免左滑后丢失关键信息 */
#table thead th,
#table tbody td {
    white-space: nowrap;
}
#table thead th:nth-child(1),
#table tbody td:nth-child(1) {
    position: sticky;
    left: 0;
    z-index: 4;
    background: #fff;
}
#table thead th:nth-child(2),
#table tbody td:nth-child(2) {
    position: sticky;
    left: 50px;
    z-index: 3;
    background: #fff;
}
#table thead th:nth-child(3),
#table tbody td:nth-child(3) {
    position: sticky;
    left: 120px;
    z-index: 2;
    background: #fff;
}
#table thead th:nth-child(1),
#table thead th:nth-child(2),
#table thead th:nth-child(3) {
    background: #f8f8f8;
}
#table tbody tr:hover td:nth-child(1),
#table tbody tr:hover td:nth-child(2),
#table tbody tr:hover td:nth-child(3) {
    background: #f5faff;
}
/* 预计到货时间为明天：整行标红（覆盖前三列吸顶背景） */
#table tbody tr.order-arrival-tomorrow > td {
    background-color: #ffe9e9;
}
#table tbody tr.order-arrival-tomorrow > td:nth-child(1),
#table tbody tr.order-arrival-tomorrow > td:nth-child(2),
#table tbody tr.order-arrival-tomorrow > td:nth-child(3) {
    background-color: #ffe9e9 !important;
}
#table tbody tr.order-arrival-tomorrow:hover > td {
    background-color: #ffd6d6;
}
#table tbody tr.order-arrival-tomorrow:hover > td:nth-child(1),
#table tbody tr.order-arrival-tomorrow:hover > td:nth-child(2),
#table tbody tr.order-arrival-tomorrow:hover > td:nth-child(3) {
    background-color: #ffd6d6 !important;
}
/* 订单操作列：主操作 + 更多下拉，紧凑排版 */
#table td[data-field="operate"] > a {
    margin-right: 6px;
    margin-bottom: 2px;
}
#table td[data-field="operate"] .btn-group {
    margin-left: 4px;
    vertical-align: middle;
}
#table td[data-field="operate"] .dropdown-menu a {
    margin: 0;
    padding: 6px 12px;
    display: block;
    white-space: nowrap;
}
</style>
