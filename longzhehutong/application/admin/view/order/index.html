<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('order/add')?'':'hide'}" title="{:__('Add')}" ><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-info btn-ludan {:$auth->check('order/ludan')?'':'hide'}" title="录单" ><i class="fa fa-edit"></i> 录单</a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('order/edit')?'':'hide'}" title="{:__('Edit')}" ><i class="fa fa-pencil"></i> {:__('Edit')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('order/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>
                        <a href="javascript:;" class="btn btn-info btn-export btn-disabled disabled {:$auth->check('order/export')?'':'hide'}" title="请先勾选要导出的订单" ><i class="fa fa-download"></i> 导出所选</a>
                    </div>
                    <!-- 订单统计信息 -->
                    <div id="order-statistics" class="order-statistics-panel" style="display: none;">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="statistics-item income"> 
                                    <div class="statistics-label">订单总运费</div>
                                    <div class="statistics-value">¥0.00</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="statistics-item expense">
                                    <div class="statistics-label">订单总成本</div>
                                    <div class="statistics-value">¥0.00</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="statistics-item profit">
                                    <div class="statistics-label">订单总利润</div>
                                    <div class="statistics-value">¥0.00</div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('order/edit')}"
                           data-operate-del="{:$auth->check('order/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<style>
.order-statistics-panel {
    margin: 15px 0;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 4px;
    border: 1px solid #ddd;
}
.statistics-item {
    text-align: center;
    padding: 15px;
    background: #fff;
    border-radius: 4px;
    border: 1px solid #e0e0e0;
    margin-bottom: 10px;
}
.statistics-item.income {
    border-left: 4px solid #5cb85c;
}
.statistics-item.expense {
    border-left: 4px solid #f0ad4e;
}
.statistics-item.profit {
    border-left: 4px solid #337ab7;
}
.statistics-label {
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
    font-weight: 500;
}
.statistics-value {
    font-size: 24px;
    font-weight: bold;
    color: #333;
}
.statistics-value.text-success {
    color: #5cb85c;
}
.statistics-value.text-danger {
    color: #d9534f;
}
.stats-amount-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.stats-amount-toggle {
    font-size: 16px;
    color: #999;
    line-height: 1;
}
.stats-amount-toggle:hover,
.stats-amount-toggle:focus {
    color: #337ab7;
    text-decoration: none;
}
</style>
